name: milestone3_training_pipeline
seed: 13

relations:
  mode: selected
  selected:
    - AtLocation
    - ObjectUse
    - xAttr
    - CapableOf
    - HasProperty
    - FilledBy
    - xIntent
    - xNeed
    - xWant

dataset:
  name: atomic2020
  hf_path: allenai/atomic2020
  cache_dir: data/cache
  local_path: data/atomic
  splits: [train, validation, test]

evaluation:
  max_instances_per_relation: all

model:
  name: google-t5/t5-small
  tokenizer_name: ${experiment.model.name}
  revision: main

prompting:
  style: prefix
  n_shot: 0
  template_set: canonical
  demonstrations:
    enabled: false
    num_examples: 0
    strategy: deterministic
    seed: ${experiment.seed}

training:
  epochs: 3
  batch_size: 8
  learning_rate: 0.00005
  optimizer: adamw_torch
  scheduler: linear
  warmup: 0
  weight_decay: 0.0
  max_input_length: 128
  max_target_length: 32
  generation_length: 32
  beam_size: 1
  seed: ${experiment.seed}
  mixed_precision: false
  output_dir: ${hydra:run.dir}/checkpoint
  tokenized_cache_dir: data/cache
  local_path: data/atomic/tokenized/${experiment.name}/${experiment.model.name}/${experiment.prompting.style}
  overwrite_cache: false
  logging_steps: 50
  save_strategy: epoch
  save_checkpoints: true
  evaluation_strategy: epoch
  predict_with_generate: true

tracking:
  backend: local
  mlflow_tracking_uri: file:${project.root}/results/mlruns
  experiment_name: ${experiment.name}

outputs:
  create_subdirs: [logs, checkpoints, plots, latex]

sweep:
  enabled: false
  dimensions: []

analysis:
  threshold: 0.30
  bootstrap_iterations: 100
  permutation_iterations: 100
  thresholds: [0.20, 0.30, 0.40, 0.50]
  instances_per_relation: [5, 10, 20, 50, 100, 200]
  n_shots: [0, 1, 3, 5, 10]
  models: [google-t5/t5-small, google-t5/t5-base, google-t5/t5-large]
  baselines: []
  prompt_variants: [canonical, alternative]
