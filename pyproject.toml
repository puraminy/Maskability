[project]
name = "maskability-index"
version = "0.1.0"
description = "Reproducible research framework for the Maskability Index experiments."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Maskability contributors" }]
dependencies = [
  "datasets>=2.20.0",
  "hydra-core>=1.3.2",
  "omegaconf>=2.3.0",
  "transformers>=4.43.0",
  "torch>=2.2.0",
  "accelerate>=0.33.0",
  "numpy>=1.26.0",
  "pandas>=2.2.0",
  "scipy>=1.13.0",
  "scikit-learn>=1.5.0",
  "matplotlib>=3.8.0",
  "seaborn>=0.13.0",
  "mlflow>=2.14.0",
  "rich>=13.7.0",
  "PyYAML>=6.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-cov>=5.0.0",
  "mypy>=1.10.0",
  "ruff>=0.5.0",
]

[project.scripts]
maskability-run = "maskability_index.experiments.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]
ignore = ["D203", "D213"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"
